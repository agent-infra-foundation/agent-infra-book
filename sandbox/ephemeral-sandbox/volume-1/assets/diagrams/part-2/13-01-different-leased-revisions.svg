<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Different agents lease different LayerStack revisions</title>
  <desc id="desc">A shared newest-first LayerStack contains layers L44, L43, L42, S40, and B1. Agent C leases revision R44, Agent B leases R43, and Agent A leases R42. Each receives a private workspace and private delta over its stable leased history.</desc>
  <metadata>Derived from the LayerStack, lease, and private-session HTML elements at https://ephemeral-sandbox.com/architecture/layerstack.</metadata>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#16749b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#2a201b" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; }
      .title { font-size: 30px; font-weight: 750; fill: #2a201b; }
      .kicker { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; fill: #16749b; }
      .card-title { font-size: 22px; font-weight: 720; fill: #2a201b; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; }
      .muted { fill: #7a695e; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="#fbf5ec"/>
  <rect x="18" y="18" width="1164" height="684" rx="24" fill="none" stroke="#e5d5bf" stroke-width="2"/>
  <text x="54" y="61" class="mono kicker">ONE HISTORY · MULTIPLE LEASED REVISIONS</text>
  <text x="54" y="102" class="sans title">Agents can begin from different points in LayerStack history</text>
  <text x="54" y="132" class="sans small muted">A lease pins a complete ordered revision—not one isolated layer.</text>

  <!-- Shared LayerStack -->
  <g filter="url(#shadow)">
    <rect x="58" y="164" width="382" height="470" rx="24" fill="#fff" stroke="#16749b" stroke-width="2.5"/>
  </g>
  <text x="88" y="202" class="mono kicker">SHARED LAYERSTACK</text>
  <text x="88" y="239" class="sans card-title">newest first</text>
  <rect x="304" y="189" width="103" height="32" rx="16" fill="#e9f7f1" stroke="#2fa87a"/>
  <text x="355" y="210" text-anchor="middle" class="mono tiny" fill="#2fa87a">head R44</text>

  <rect x="91" y="267" width="316" height="58" rx="13" fill="#dff3eb" stroke="#2fa87a" stroke-width="1.5"/>
  <text x="113" y="292" class="mono tiny" fill="#2fa87a">L44</text>
  <text x="174" y="292" class="sans small">test fixes</text>
  <text x="113" y="313" class="sans tiny muted">newest published delta</text>

  <rect x="103" y="333" width="292" height="58" rx="13" fill="#e8f3f7" stroke="#16749b" stroke-width="1.5"/>
  <text x="125" y="358" class="mono tiny" fill="#16749b">L43</text>
  <text x="186" y="358" class="sans small">API update</text>
  <text x="125" y="379" class="sans tiny muted">earlier published delta</text>

  <rect x="115" y="399" width="268" height="58" rx="13" fill="#edf5f7" stroke="#72acc4"/>
  <text x="137" y="424" class="mono tiny" fill="#16749b">L42</text>
  <text x="198" y="424" class="sans small">auth refactor</text>
  <text x="137" y="445" class="sans tiny muted">earlier published delta</text>

  <rect x="127" y="465" width="244" height="54" rx="13" fill="#eef5f3" stroke="#9ecfbd"/>
  <text x="149" y="498" class="mono tiny" fill="#2a201b">S40 · compacted history</text>

  <rect x="139" y="527" width="220" height="50" rx="13" fill="#f3e6d0" stroke="#b97445"/>
  <text x="161" y="558" class="mono tiny" fill="#2a201b">B1 · shared base</text>
  <text x="249" y="608" text-anchor="middle" class="mono tiny muted">immutable shared bytes</text>

  <!-- Lease lines -->
  <path d="M407 296 H534" fill="none" stroke="#16749b" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
  <path d="M395 362 H485 V367 H534" fill="none" stroke="#16749b" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
  <path d="M383 428 H469 V528 H534" fill="none" stroke="#16749b" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
  <rect x="444" y="272" width="108" height="29" rx="14" fill="#fbf5ec" stroke="#e5d5bf"/>
  <text x="498" y="291" text-anchor="middle" class="mono tiny" fill="#16749b">lease R44</text>
  <rect x="444" y="342" width="108" height="29" rx="14" fill="#fbf5ec" stroke="#e5d5bf"/>
  <text x="498" y="361" text-anchor="middle" class="mono tiny" fill="#16749b">lease R43</text>
  <rect x="444" y="499" width="108" height="29" rx="14" fill="#fbf5ec" stroke="#e5d5bf"/>
  <text x="498" y="518" text-anchor="middle" class="mono tiny" fill="#16749b">lease R42</text>

  <!-- Agent C / R44 -->
  <g filter="url(#shadow)">
    <rect x="552" y="220" width="580" height="132" rx="21" fill="#fff" stroke="#2fa87a" stroke-width="2"/>
  </g>
  <circle cx="587" cy="256" r="18" fill="#f3e6d0"/>
  <text x="587" y="262" text-anchor="middle" class="mono tiny" fill="#16749b">C</text>
  <text x="619" y="260" class="sans card-title">Agent C workspace</text>
  <text x="619" y="286" class="sans tiny muted">started when active head was R44</text>
  <rect x="579" y="305" width="334" height="30" rx="15" fill="#e8f3f7"/>
  <text x="746" y="325" text-anchor="middle" class="mono tiny" fill="#16749b">L44:L43:L42:S40:B1 · leased RO</text>
  <rect x="938" y="242" width="155" height="48" rx="24" fill="#e9f7f1" stroke="#2fa87a"/>
  <text x="1015" y="271" text-anchor="middle" class="mono tiny" fill="#2fa87a">private ΔC · RW</text>

  <!-- Agent B / R43 -->
  <g filter="url(#shadow)">
    <rect x="552" y="372" width="580" height="132" rx="21" fill="#fff" stroke="#2fa87a" stroke-width="2"/>
  </g>
  <circle cx="587" cy="408" r="18" fill="#f3e6d0"/>
  <text x="587" y="414" text-anchor="middle" class="mono tiny" fill="#16749b">B</text>
  <text x="619" y="412" class="sans card-title">Agent B workspace</text>
  <text x="619" y="438" class="sans tiny muted">started when active head was R43</text>
  <rect x="579" y="457" width="307" height="30" rx="15" fill="#e8f3f7"/>
  <text x="732" y="477" text-anchor="middle" class="mono tiny" fill="#16749b">L43:L42:S40:B1 · leased RO</text>
  <rect x="938" y="394" width="155" height="48" rx="24" fill="#e9f7f1" stroke="#2fa87a"/>
  <text x="1015" y="423" text-anchor="middle" class="mono tiny" fill="#2fa87a">private ΔB · RW</text>

  <!-- Agent A / R42 -->
  <g filter="url(#shadow)">
    <rect x="552" y="524" width="580" height="132" rx="21" fill="#fff" stroke="#2fa87a" stroke-width="2"/>
  </g>
  <circle cx="587" cy="560" r="18" fill="#f3e6d0"/>
  <text x="587" y="566" text-anchor="middle" class="mono tiny" fill="#16749b">A</text>
  <text x="619" y="564" class="sans card-title">Agent A workspace</text>
  <text x="619" y="590" class="sans tiny muted">started when active head was R42</text>
  <rect x="579" y="609" width="280" height="30" rx="15" fill="#e8f3f7"/>
  <text x="719" y="629" text-anchor="middle" class="mono tiny" fill="#16749b">L42:S40:B1 · leased RO</text>
  <rect x="938" y="546" width="155" height="48" rx="24" fill="#e9f7f1" stroke="#2fa87a"/>
  <text x="1015" y="575" text-anchor="middle" class="mono tiny" fill="#2fa87a">private ΔA · RW</text>

  <text x="552" y="687" class="sans small" fill="#704281">Older leases remain stable while the active head continues to advance.</text>
</svg>
