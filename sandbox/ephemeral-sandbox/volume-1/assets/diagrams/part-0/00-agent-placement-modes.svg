<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two agent placement modes</title>
  <desc id="desc">In mode one, the agent runtime, tools, and workspace are inside the sandbox environment. In mode two, the agent runtime is outside and connects through an execution protocol to tools and a workspace inside the sandbox environment. The model service may be remote in both modes.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:3}.sandbox{fill:#ecfeff;stroke:#0891b2;stroke-width:4}.runtime{fill:#e0f2fe;stroke:#2563eb;stroke-width:4}.state{fill:#fff7ed;stroke:#d97706;stroke-width:3}.title{font:700 42px 'Segoe UI',Arial,sans-serif;fill:#102a43}.subtitle{font:20px 'Segoe UI',Arial,sans-serif;fill:#52667a}.mode{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#102a43}.label{font:700 27px 'Segoe UI',Arial,sans-serif;fill:#102a43}.small{font:18px 'Segoe UI',Arial,sans-serif;fill:#52667a}.note{font:600 19px 'Segoe UI',Arial,sans-serif;fill:#6b4f9e}.arrow{fill:none;stroke:#6b4f9e;stroke-width:5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6b4f9e"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="70" y="78">Two Agent Placement Modes</text>
  <text class="subtitle" x="70" y="116">Classify the system by where the model → tool → observation → next-model-call cycle runs.</text>
  <text class="note" x="800" y="158" text-anchor="middle">The model service may be remote in both modes.</text>

  <rect class="panel" x="70" y="190" width="700" height="620" rx="26"/>
  <text class="mode" x="420" y="245" text-anchor="middle">Mode 1 · In-sandbox agent</text>
  <rect class="sandbox" x="135" y="285" width="570" height="450" rx="24"/>
  <text class="label" x="420" y="330" text-anchor="middle">Sandbox environment</text>
  <rect class="runtime" x="215" y="370" width="410" height="105" rx="20"/>
  <text class="label" x="420" y="432" text-anchor="middle">Agent runtime</text>
  <rect class="state" x="215" y="530" width="180" height="110" rx="18"/>
  <text class="label" x="305" y="596" text-anchor="middle">Tools</text>
  <rect class="state" x="445" y="530" width="180" height="110" rx="18"/>
  <text class="label" x="535" y="596" text-anchor="middle">Workspace</text>
  <path d="M420 475V520" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)" fill="none"/>

  <rect class="panel" x="830" y="190" width="700" height="620" rx="26"/>
  <text class="mode" x="1180" y="245" text-anchor="middle">Mode 2 · External agent</text>
  <rect class="runtime" x="1010" y="285" width="340" height="100" rx="20"/>
  <text class="label" x="1180" y="346" text-anchor="middle">Agent runtime</text>
  <path class="arrow" d="M1180 390V465"/>
  <text class="note" x="1205" y="435">Execution protocol</text>
  <rect class="sandbox" x="895" y="470" width="570" height="265" rx="24"/>
  <text class="label" x="1180" y="518" text-anchor="middle">Sandbox environment</text>
  <rect class="state" x="980" y="560" width="180" height="110" rx="18"/>
  <text class="label" x="1070" y="626" text-anchor="middle">Tools</text>
  <rect class="state" x="1210" y="560" width="180" height="110" rx="18"/>
  <text class="label" x="1300" y="626" text-anchor="middle">Workspace</text>

  <text class="small" x="800" y="858" text-anchor="middle">An execution worker performs requests inside Mode 2; it does not create a third placement mode.</text>
</svg>
